<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilha — vida no campo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=iara1">
</head>
<body>

  <!-- TÍTULO -->
  <section id="screen-title" class="screen" hidden>
    <div class="frame"><canvas id="title-canvas" class="pixel" width="256" height="160"></canvas></div>
    <h1 class="logo">TRILHA</h1>
    <p class="subtitle">Uma vida no campo</p>
    <div class="win notice" id="save-notice" hidden></div>
    <div class="win title-menu">
      <button id="btn-continue" class="menu-item" hidden>Continuar</button>
      <button id="btn-new" class="menu-item">Novo jogo</button>
    </div>
  </section>

  <!-- CRIAÇÃO DE PERSONAGEM -->
  <section id="screen-create" class="screen" hidden>
    <div class="win create-win">
      <div class="steps" id="steps"></div>
      <div class="create-body">
        <div class="preview">
          <div class="views" id="preview-views" aria-label="Prévia: frente, lado esquerdo, costas e lado direito">
            <figure><canvas class="pixel" width="36" height="44"></canvas><figcaption>Frente</figcaption></figure>
            <figure><canvas class="pixel" width="36" height="44"></canvas><figcaption>Esquerda</figcaption></figure>
            <figure><canvas class="pixel" width="36" height="44"></canvas><figcaption>Costas</figcaption></figure>
            <figure><canvas class="pixel" width="36" height="44"></canvas><figcaption>Direita</figcaption></figure>
          </div>
          <div class="preview-info">
            <div class="preview-name" id="preview-name"></div>
            <div class="preview-farm" id="preview-farm"></div>
            <div class="preview-age"><span id="preview-pet"></span> 22 anos</div>
          </div>
        </div>
        <div class="create-step">
          <h2 id="step-title"></h2>
          <p class="hint" id="step-hint"></p>
          <div id="step-content"></div>
        </div>
      </div>
      <div class="create-nav">
        <button id="btn-back" class="btn" type="button">◀ Voltar</button>
        <button id="btn-random" class="btn" type="button">🎲 Aparência aleatória</button>
        <button id="btn-next" class="btn primary" type="button">Avançar ▶</button>
      </div>
    </div>
  </section>

  <!-- JOGO: ocupa a janela inteira; HUD, botões e barra ficam por cima do cenário -->
  <section id="screen-game" class="screen" hidden>
    <div class="stage" id="stage">
      <div class="scene-wrap" id="scene-wrap">
        <canvas id="scene" class="pixel" width="256" height="160" aria-label="Cenário: clique ou toque em pessoas, portas e objetos próximos"></canvas>
      </div>
      <div class="hud" id="hud"></div>
      <div class="objective" id="objective"></div>
      <nav class="actions" id="actions">
        <button class="btn" type="button" data-tab="mochila" id="btn-menu" title="Menu (E ou Esc)">☰ Menu</button>
        <button class="btn" type="button" data-tab="diario" title="Diário (F)">Diário</button>
        <button class="btn" type="button" data-tab="mapa" id="btn-map" title="Mapa (M)">Mapa</button>
        <button class="btn" type="button" id="btn-full" title="Tela cheia">Tela cheia</button>
        <button class="btn" type="button" id="btn-pause" title="Pausa (tecla P)" aria-label="Pausa">⏸</button>
      </nav>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <!-- pesca: minijogo, resultado e botão de recolher (para toque) -->
      <canvas class="fishbar pixel" id="fishbar" width="100" height="17" hidden aria-label="Minijogo de pesca: mantenha o peixe na faixa verde"></canvas>
      <div class="fishtip" id="fishtip" hidden></div>
      <div class="win catch" id="catch" hidden aria-live="polite"></div>
      <button type="button" class="btn fish-cancel" id="fish-cancel" hidden>✕ Recolher linha (Esc)</button>
      <div class="hint-bar" id="hint" hidden></div>

      <div class="bottom">
        <!-- conversa: aparece só quando alguém fala -->
        <div class="win dialog" id="dialog" hidden>
          <canvas id="portrait" class="pixel portrait" width="24" height="20"></canvas>
          <div class="dialog-main">
            <div class="who" id="dlg-who"></div>
            <div class="text" id="dlg-text"></div>
            <div class="choices" id="dlg-choices"></div>
            <form class="dlg-form" id="dlg-form" hidden>
              <input id="dlg-input" type="text" maxlength="16" autocomplete="off">
              <button class="btn primary" type="submit">Confirmar</button>
            </form>
            <div class="dlg-msg" id="dlg-msg" aria-live="polite"></div>
          </div>
          <div class="more" id="dlg-more">▼</div>
        </div>

        <!-- barra de itens e controles de toque -->
        <div class="dock" id="dock">
          <div class="touch" id="touch" aria-label="Controles de direção">
            <button class="tb up" type="button" data-dir="up" aria-label="Cima">▲</button>
            <button class="tb left" type="button" data-dir="left" aria-label="Esquerda">◀</button>
            <button class="tb right" type="button" data-dir="right" aria-label="Direita">▶</button>
            <button class="tb down" type="button" data-dir="down" aria-label="Baixo">▼</button>
          </div>
          <div class="hotbar-wrap">
            <div class="equipped" id="equipped"></div>
            <div class="hotbar" id="hotbar" aria-label="Barra de itens"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- painéis que abrem sob demanda -->
    <!-- menu principal da partida: abas no alto, janela de madeira; o cenário fica escurecido atrás -->
    <div class="modal" id="modal" hidden>
      <div class="menu-wrap">
        <div class="tabs" id="tabs" role="tablist" aria-label="Abas do menu">
          <button type="button" role="tab" data-tab="mochila" data-label="Inventário" title="Inventário" aria-label="Inventário"></button>
          <button type="button" role="tab" data-tab="amizades" data-label="Amizades" title="Amizades" aria-label="Amizades"></button>
          <button type="button" role="tab" data-tab="mapa" data-label="Mapa" title="Mapa" aria-label="Mapa"></button>
          <button type="button" role="tab" data-tab="diario" data-label="Diário" title="Diário" aria-label="Diário"></button>
          <button type="button" role="tab" data-tab="personagem" data-label="Personagem" title="Personagem" aria-label="Personagem"></button>
          <button type="button" role="tab" data-tab="config" data-label="Configurações" title="Configurações" aria-label="Configurações"></button>
        </div>
        <div class="win modal-win" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <button type="button" class="close" id="modal-close" aria-label="Fechar (E ou Esc)" title="Fechar (E ou Esc)">✕</button>
          <h2 class="modal-title" id="modal-title"></h2>
          <div class="modal-body" id="modal-body"></div>
        </div>
      </div>
    </div>

    <!-- pausa: o tempo para -->
    <div class="modal" id="pause" hidden>
      <div class="win pause-win" role="dialog" aria-modal="true" aria-label="Pausa">
        <h2>Pausado</h2>
        <p class="dim">O tempo do jogo está parado.</p>
        <button type="button" class="btn primary" id="pause-go">Continuar ▶</button>
      </div>
    </div>

    <!-- carta do avô -->
    <div class="modal" id="letter" hidden>
      <div class="paper" role="dialog" aria-modal="true" aria-label="Carta">
        <div class="letter-body" id="letter-body"></div>
        <button type="button" class="btn primary" id="letter-ok">Guardar a carta ▶</button>
      </div>
    </div>

    <!-- pinturas de Iara -->
    <div class="modal" id="painting" hidden>
      <div class="win modal-win painting-win" role="dialog" aria-modal="true" aria-labelledby="painting-title">
        <h3 id="painting-title">Pintura</h3>
        <div class="painting-body" id="painting-body"></div>
        <button type="button" class="btn primary" id="painting-ok">Fechar ▶</button>
      </div>
    </div>

    <!-- resumo ao dormir -->
    <div class="modal" id="summary" hidden>
      <div class="win modal-win" role="dialog" aria-modal="true" aria-label="Resumo do dia"><div class="modal-body" id="summary-body"></div></div>
    </div>
  </section>

  <script src="js/data.js?v=iara1"></script>
  <script src="js/sprites.js?v=iara1"></script>
  <script src="js/portraits.js?v=iara1"></script>
  <script src="js/iara-portrait.js?v=iara1"></script>
  <script src="js/fishcore.js?v=iara1"></script>
  <script src="js/world.js?v=iara1"></script>
  <script src="js/game.js?v=iara1"></script>
</body>
</html>
